name: calepin

services:
  postgres:
    image: postgres:16-alpine
    container_name: calepin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: calepin
      POSTGRES_PASSWORD: calepin
      POSTGRES_DB: calepin
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calepin -d calepin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: calepin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: calepin-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: calepin
      MINIO_ROOT_PASSWORD: calepin_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP sandbox for the email sign-in link (CAL-025). Catches every message
  # sent to EMAIL_SERVER_HOST/PORT in apps/web/.env.example instead of
  # delivering it — the web UI is where a local sign-in link is read.
  mailpit:
    image: axllent/mailpit:latest
    container_name: calepin-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
