name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Postgres and Redis are attached here per the task spec. The unit
    # project touches no network (CLAUDE.md §8) and the integration project
    # starts its own ephemeral Postgres via Testcontainers (test/integration/
    # global-setup.ts) rather than using these — see CLAUDE.md §2. They are
    # provided anyway so this job is ready for CAL-011 (Prisma) and CAL-060
    # (BullMQ worker) without touching the pipeline again.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calepin
          POSTGRES_PASSWORD: calepin
          POSTGRES_DB: calepin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calepin -d calepin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://calepin:calepin@localhost:5432/calepin
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:integration

  test-e2e:
    name: Test (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The revisit CAL-007's review said would be needed "once CAL-011/CAL-060
    # add a real connection": CAL-024 is it. The session suite signs a browser
    # in and reloads twice, which is a session row in a real database — so the
    # job now attaches Postgres and applies the committed migrations to it.
    # Redis and S3 are still shape-valid values only; nothing connects to them
    # until CAL-060.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calepin
          POSTGRES_PASSWORD: calepin
          POSTGRES_DB: calepin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calepin -d calepin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://calepin:calepin@localhost:5432/calepin
      # Local-only, and deliberately not a secret: this key signs sessions that
      # exist for the length of one job. A deployment reads its own.
      AUTH_SECRET: ci-e2e-signing-key-of-at-least-32-characters
      # Shape-valid only (CAL-025): nothing in the E2E suite sends an email yet
      # (CAL-028 wires the sign-in screen), so nothing connects to this host.
      EMAIL_SERVER_HOST: localhost
      EMAIL_SERVER_PORT: "1025"
      EMAIL_SERVER_USER: calepin
      EMAIL_SERVER_PASSWORD: calepin_local
      EMAIL_FROM: connexion@calepin.test
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: calepin
      S3_ACCESS_KEY_ID: calepin
      S3_SECRET_ACCESS_KEY: calepin_local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Since CAL-024 the root layout reads the session, so the build evaluates
    # `@calepin/shared/config` while collecting page data and needs a complete
    # environment. Shape-valid values are enough: nothing connects, because
    # nothing is prerendered once every route is dynamic.
    env:
      DATABASE_URL: postgresql://calepin:calepin@localhost:5432/calepin
      AUTH_SECRET: ci-build-signing-key-of-at-least-32-characters
      EMAIL_SERVER_HOST: localhost
      EMAIL_SERVER_PORT: "1025"
      EMAIL_SERVER_USER: calepin
      EMAIL_SERVER_PASSWORD: calepin_local
      EMAIL_FROM: connexion@calepin.test
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: calepin
      S3_ACCESS_KEY_ID: calepin
      S3_SECRET_ACCESS_KEY: calepin_local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
