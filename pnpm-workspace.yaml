packages:
  - apps/*
  - packages/*

# pnpm 10 blocks postinstall scripts by default. These two are the ones
# create-next-app itself declines to build; both ship prebuilt binaries as
# optional dependencies, so nothing needs compiling locally.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
  # BullMQ's msgpackr pulls in a native encoder as an optional accelerator
  # (CAL-060). It falls back to the JavaScript path when absent, and a queue
  # whose payloads are identifiers and counts has nothing to accelerate.
  - msgpackr-extract
